  <!-- Twitter Card -->

  <meta name="twitter:title"       content="OTO Enterprises, where every detail matters." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    .typewriter-line2 {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header class="video-header">
  <video autoplay muted loop playsinline class="background-video">
    <source src="videos/ty.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <nav class="navbar" id="navbar">
    <div class="navbar-content">
      <div class="logo">
        <a href="/home/"><img src="photos/otologowhite.png" alt="Logo" class="logo-img" /></a>
      </div>

      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="/home/">Home</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/services/">Services</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>

        <div class="nav-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="https://www.instagram.com/otoenterprises" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="https://www.linkedin.com/company/oto-enterprises-inc/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="hero-text">
    <div class="overlay-content">
      <div class="typewriter-lines">
        <h1 class="typewriter-line1 typing">Thank You For Reaching Out!</h1>
        <p class="typewriter-line2">We read every word. We’ll reply with the same care you wrote it with.</p>
        <p style="margin-top: 2rem;">
            <a href="index.html" style="
              font-family: 'Cormorant Garamond', serif;
              font-size: 1.05rem;
              font-weight: 500;
              color: white;
              padding: 0.5rem 1.5rem;
              border: 2px solid white;
              text-decoration: none;
              transition: all 0.3s ease;
              display: inline-block;
            " onmouseover="this.style.backgroundColor='white'; this.style.color='#111';" 
               onmouseout="this.style.backgroundColor='transparent'; this.style.color='white';">
              Back to Home
            </a>
          </p>
          
      </div>
    </div>
  </div>
</header>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const typewriterEl = document.querySelector(".typing");
    const fadeEl = document.querySelector(".typewriter-line2");

    const text = typewriterEl.textContent;
    typewriterEl.textContent = "";
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        typewriterEl.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 60);
      } else {
        fadeEl.classList.add("fade-in");
      }
    }

    typeWriter();
  });
</script>

</body>
</html>
